<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmacy Manager - Categories</title>

<!-- Supabase client library, loaded from a CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<link rel="stylesheet" href="styles.css">

</head>
<body>

<div class="app-layout">

  <aside class="sidebar" id="sidebar"></aside>
  <script src="../js/sidebar.js"></script>

  <div class="main-content">
    <header>
      <div class="inner">
        <div>
          <h1>Pharmacy Manager</h1>
          <div class="subtitle">Page : Medicine Categories</div>
        </div>
        <button class="btn-primary" onclick="openModal()">+ Add category</button>
      </div>
    </header>

    <main>
      <div class="stats">
        <div class="stat-card">
          <div class="value" id="stat-total">0</div>
          <div class="label">Categories</div>
        </div>
        <div class="stat-card">
          <div class="value" id="stat-active">0</div>
          <div class="label">Active</div>
        </div>
        <div class="stat-card">
          <div class="value" id="stat-inactive">0</div>
          <div class="label">Inactive</div>
        </div>
      </div>

      <div class="toolbar">
        <input type="search" id="search" placeholder="Search category by name or description..." oninput="renderTable()">
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Category</th>
              <th>Description</th>
              <th>Medicines</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- rows injected by JS -->
          </tbody>
        </table>
        <div class="empty-state" id="empty-state" style="display:none;">
          No categories found. Click "Add category" to create one.
        </div>
      </div>

      <!-- Medicines of the selected category -->
      <div id="by-category" style="display:none; margin-top:24px;">
        <h2 id="by-category-title" style="margin-bottom:12px;"></h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Code</th>
                <th>Medicine</th>
                <th>Form</th>
                <th>Strength</th>
                <th>In stock</th>
                <th>Price</th>
              </tr>
            </thead>
            <tbody id="by-category-body"></tbody>
          </table>
          <div class="empty-state" id="by-category-empty" style="display:none;">
            No medicines in this category yet.
          </div>
        </div>
      </div>
    </main>
  </div>

</div>

<!-- Add / Edit modal -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h2 id="modal-title">Add category</h2>
    <form id="category-form" onsubmit="saveCategory(event)">
      <input type="hidden" id="category-id">
      <div class="field">
        <label for="category-name">Category name</label>
        <input type="text" id="category-name" required maxlength="100" placeholder="e.g. Antibiotics">
      </div>
      <div class="field">
        <label for="description">Description</label>
        <input type="text" id="description" placeholder="Optional">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
<script>
/* 2) STATE */
let categories = [];
let medCounts = {};   // category_id -> number of active medicines

/* 3) DATA LOADING */
async function loadCategories() {
  const [cats, meds] = await Promise.all([
    supabaseClient.from("categories").select("*").order("category_name", { ascending: true }),
    supabaseClient.from("medicines").select("category_id").eq("status", "Active"),
  ]);

  if (cats.error) { console.error("Error loading categories:", cats.error.message); return; }
  if (meds.error) { console.error("Error loading medicine counts:", meds.error.message); }

  categories = cats.data;
  medCounts = {};
  (meds.data || []).forEach(m => {
    if (m.category_id != null) medCounts[m.category_id] = (medCounts[m.category_id] || 0) + 1;
  });
  renderTable();
  renderStats();
}

/* 4) RENDERING */
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function renderTable() {
  const query = document.getElementById("search").value.toLowerCase();
  const filtered = categories.filter(c =>
    c.category_name.toLowerCase().includes(query) ||
    (c.description || "").toLowerCase().includes(query)
  );

  document.getElementById("empty-state").style.display = filtered.length ? "none" : "block";

  document.getElementById("table-body").innerHTML = filtered.map(c => {
    const active = c.status === "Active";
    return `
    <tr>
      <td>${escapeHtml(c.category_name)}</td>
      <td>${escapeHtml(c.description || "—")}</td>
      <td>${medCounts[c.category_id] || 0}</td>
      <td><span class="badge ${active ? "badge-success" : "badge-danger"}">${c.status}</span></td>
      <td>
        <button class="btn-secondary btn-small" onclick="showMedicines(${c.category_id})">View medicines</button>
        <button class="btn-secondary btn-small" onclick="editCategory(${c.category_id})">Edit</button>
        <button class="${active ? "btn-danger" : "btn-secondary"} btn-small" onclick="toggleStatus(${c.category_id})">
          ${active ? "Deactivate" : "Activate"}
        </button>
      </td>
    </tr>`;
  }).join("");
}

function renderStats() {
  document.getElementById("stat-total").textContent = categories.length;
  document.getElementById("stat-active").textContent = categories.filter(c => c.status === "Active").length;
  document.getElementById("stat-inactive").textContent = categories.filter(c => c.status !== "Active").length;
}

/* 5) DISPLAY MEDICINES BY CATEGORY */
async function showMedicines(id) {
  const cat = categories.find(c => c.category_id == id);
  if (!cat) return;

  const { data, error } = await supabaseClient
    .from("v_medicine_stock")
    .select("medicine_code, medicine_name, dosage_form, strength, quantity_on_hand, unit_price")
    .eq("category_name", cat.category_name)
    .eq("status", "Active")
    .order("medicine_name", { ascending: true });

  if (error) { alert("Could not load medicines: " + error.message); return; }

  document.getElementById("by-category-title").textContent = "Medicines in " + cat.category_name;
  document.getElementById("by-category-empty").style.display = data.length ? "none" : "block";
  document.getElementById("by-category-body").innerHTML = data.map(m => `
    <tr>
      <td>${escapeHtml(m.medicine_code)}</td>
      <td>${escapeHtml(m.medicine_name)}</td>
      <td>${escapeHtml(m.dosage_form)}</td>
      <td>${escapeHtml(m.strength || "—")}</td>
      <td>${m.quantity_on_hand}</td>
      <td>${Number(m.unit_price || 0).toFixed(2)}</td>
    </tr>`).join("");

  const panel = document.getElementById("by-category");
  panel.style.display = "block";
  panel.scrollIntoView({ behavior: "smooth" });
}

/* 6) MODAL / FORM HANDLING */
function openModal() {
  document.getElementById("modal-title").textContent = "Add category";
  document.getElementById("category-form").reset();
  document.getElementById("category-id").value = "";
  document.getElementById("modal-backdrop").classList.add("open");
}

function closeModal() {
  document.getElementById("modal-backdrop").classList.remove("open");
}

function editCategory(id) {
  const cat = categories.find(c => c.category_id == id);
  if (!cat) return;
  document.getElementById("modal-title").textContent = "Edit category";
  document.getElementById("category-id").value = cat.category_id;
  document.getElementById("category-name").value = cat.category_name;
  document.getElementById("description").value = cat.description || "";
  document.getElementById("modal-backdrop").classList.add("open");
}

async function saveCategory(event) {
  event.preventDefault();
  const id = document.getElementById("category-id").value;
  const record = {
    category_name: document.getElementById("category-name").value.trim(),
    description: document.getElementById("description").value.trim() || null,
  };

  const { error } = id
    ? await supabaseClient.from("categories").update(record).eq("category_id", id)
    : await supabaseClient.from("categories").insert(record);

  if (error) {
    alert(error.code === "23505"
      ? "A category with that name already exists."
      : "Could not save: " + error.message);
    return;
  }
  closeModal();
  loadCategories();
}

async function toggleStatus(id) {
  const cat = categories.find(c => c.category_id == id);
  if (!cat) return;
  const next = cat.status === "Active" ? "Inactive" : "Active";
  if (next === "Inactive" &&
      !confirm("Deactivate this category? It will no longer be offered when registering medicines. Existing medicines keep it.")) return;

  const { error } = await supabaseClient.from("categories").update({ status: next }).eq("category_id", id);
  if (error) { alert("Could not update status: " + error.message); return; }
  loadCategories();
}

/* 7) INIT */
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { window.location.href = "login-page.html"; return; }
  loadCategories();
})();
</script>

</body>
</html>
