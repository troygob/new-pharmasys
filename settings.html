<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmacy Manager</title>

<!-- Supabase client library, loaded from a CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<link rel="stylesheet" href="styles.css">

</head>
<body>

<div class="app-layout">
<aside class="sidebar" id="sidebar"></aside>
<script src="../js/sidebar.js"></script>

  <div class="main-content">
    <header>
      <div class="inner">
        <div>
          <h1>Pharmacy Manager</h1>
          <div class="subtitle">Page : SETTINGS</div>
        </div>
        <button class="btn-primary" onclick="openModal()">+ Add medicine</button>
      </div>
    </header>

    <main>
      <div class="stats">
        <div class="stat-card">
          <div class="value" id="stat-total">0</div>
          <div class="label">WIP</div>
        </div>
      </div>
    </main>
  </div>

</div>

<!-- Add / Edit modal -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h2 id="modal-title">Add medicine</h2>
    <form id="medicine-form" onsubmit="saveMedicine(event)">
      <input type="hidden" id="medicine-id">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" required placeholder="e.g. Amoxicillin 500mg">
      </div>
      <div class="field">
        <label for="category">Category</label>
        <input type="text" id="category" placeholder="e.g. Antibiotic">
      </div>
      <div class="field">
        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" required min="0" value="0">
      </div>
      <div class="field">
        <label for="price">Price</label>
        <input type="number" id="price" step="0.01" min="0" value="0">
      </div>
      <div class="field">
        <label for="expiry_date">Expiry date</label>
        <input type="date" id="expiry_date">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>



</body>
</html>
