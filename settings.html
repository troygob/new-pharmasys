<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmacy Manager - Settings</title>

<!-- Supabase client library, loaded from a CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config/supabase.js"></script>
<script src="./js/auth.js"></script>
<link rel="stylesheet" href="css/styles.css">

<script defer src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js"></script>
  <script defer src="./js/motion.js"></script>
  <script defer src="./js/sidebar-router.js"></script>
</head>
<body>

<div class="app-layout">

  <aside class="sidebar" id="sidebar"></aside>
  <script src="./js/sidebar.js"></script>

  <div class="main-content">
    <header>
      <div class="inner">
        <div>
          <h1>Pharmacy Manager</h1>
          <div class="subtitle">Page : Settings</div>
        </div>
      </div>
    </header>

    <main>
      <div class="table-wrap" style="padding:1.5rem; max-width:520px;">
        <h2 style="margin-top:0;">My account</h2>
        <div class="field"><label>Email</label><div id="acc-email">—</div></div>
        <div class="field"><label>Name</label><div id="acc-name">—</div></div>
        <div class="field"><label>Role</label><div id="acc-role">—</div></div>
      </div>

      <div class="table-wrap" style="padding:1.5rem; max-width:520px; margin-top:1rem;">
        <h2 style="margin-top:0;">Change password</h2>
        <form id="pw-form" onsubmit="changePassword(event)">
          <div class="field">
            <label for="new-password">New password</label>
            <input type="password" id="new-password" required minlength="8" placeholder="At least 8 characters">
          </div>
          <div class="field">
            <label for="confirm-password">Confirm new password</label>
            <input type="password" id="confirm-password" required minlength="8">
          </div>
          <div id="pw-message" style="font-size:0.9rem; margin-bottom:1rem;"></div>
          <button type="submit" class="btn-primary">Update password</button>
        </form>
      </div>
    </main>
  </div>

</div>

<script>
async function changePassword(event) {
  event.preventDefault();
  const msg = document.getElementById("pw-message");
  const a = document.getElementById("new-password").value;
  const b = document.getElementById("confirm-password").value;

  if (a !== b) { msg.style.color = "var(--color-danger)"; msg.textContent = "The two passwords do not match."; return; }

  const { error } = await supabaseClient.auth.updateUser({ password: a });
  if (error) { msg.style.color = "var(--color-danger)"; msg.textContent = error.message; return; }

  msg.style.color = "var(--color-success)";
  msg.textContent = "Password updated.";
  document.getElementById("pw-form").reset();
}

(async () => {
  const me = await getProfile();
  if (!me) return;
  document.getElementById("acc-email").textContent = me.email;
  document.getElementById("acc-name").textContent  = me.full_name || "—";
  document.getElementById("acc-role").textContent  = me.role || "No role";
})();
</script>

</body>
</html>
