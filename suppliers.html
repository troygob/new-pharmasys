<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmacy Manager - Suppliers</title>

<!-- Supabase client library, loaded from a CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<link rel="stylesheet" href="styles.css">

</head>
<body>

<div class="app-layout">

<aside class="sidebar" id="sidebar"></aside>
<script src="../js/sidebar.js"></script>

  <div class="main-content">
    <header>
      <div class="inner">
        <div>
          <h1>Pharmacy Manager</h1>
          <div class="subtitle">Page : Suppliers</div>
        </div>
        <button class="btn-primary" onclick="openModal()">+ Add supplier</button>
      </div>
    </header>

    <main>
      <div class="stats">
        <div class="stat-card">
          <div class="value" id="stat-total">0</div>
          <div class="label">Suppliers</div>
        </div>
        <div class="stat-card">
          <div class="value" id="stat-active">0</div>
          <div class="label">Active</div>
        </div>
        <div class="stat-card">
          <div class="value" id="stat-inactive">0</div>
          <div class="label">Inactive</div>
        </div>
      </div>

      <div class="toolbar">
        <input type="search" id="search" placeholder="Search by code, name, contact person, number or email..." oninput="renderTable()">
        <select id="status-filter" onchange="renderTable()" style="padding:0.6rem 0.9rem; border:1px solid var(--color-border); border-radius:var(--radius-sm); background:var(--color-surface);">
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
          <option value="All">All</option>
        </select>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Code</th>
              <th>Supplier</th>
              <th>Contact person</th>
              <th>Contact no.</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- rows injected by JS -->
          </tbody>
        </table>
        <div class="empty-state" id="empty-state" style="display:none;">
          No suppliers found. Click "Add supplier" to create one.
        </div>
      </div>
    </main>
  </div>

</div>

<!-- Add / Edit modal -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h2 id="modal-title">Add supplier</h2>
    <form id="supplier-form" onsubmit="saveSupplier(event)">
      <input type="hidden" id="supplier-id">
      <div class="field">
        <label for="supplier-code">Supplier code</label>
        <input type="text" id="supplier-code" required maxlength="20" placeholder="e.g. SUP001" style="text-transform:uppercase;">
      </div>
      <div class="field">
        <label for="supplier-name">Supplier name</label>
        <input type="text" id="supplier-name" required maxlength="150" placeholder="e.g. ABC Pharmaceutical">
      </div>
      <div class="field">
        <label for="contact-person">Contact person</label>
        <input type="text" id="contact-person" maxlength="100" placeholder="e.g. Juan Santos">
      </div>
      <div class="field">
        <label for="contact-no">Contact no.</label>
        <input type="tel" id="contact-no" maxlength="20" placeholder="e.g. 09123456789">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" maxlength="150" placeholder="e.g. supplier@email.com">
      </div>
      <div class="field">
        <label for="address">Address</label>
        <input type="text" id="address" maxlength="255" placeholder="Optional">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn-primary">Save supplier</button>
      </div>
    </form>
  </div>
</div>

<!-- View modal (read-only) -->
<div class="modal-backdrop" id="view-backdrop">
  <div class="modal">
    <h2 id="view-title">Supplier details</h2>
    <div id="view-body"></div>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" onclick="closeView()">Close</button>
    </div>
  </div>
</div>

<script>
/* 2) STATE */
let suppliers = [];

/* 3) DATA LOADING */
async function loadSuppliers() {
  const { data, error } = await supabaseClient
    .from("suppliers")
    .select("*")
    .order("supplier_name", { ascending: true });

  if (error) { console.error("Error loading suppliers:", error.message); alert("Could not load suppliers: " + error.message); return; }
  suppliers = data;
  renderTable();
  renderStats();
}

/* 4) RENDERING */
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : str;
  return div.innerHTML;
}

function renderTable() {
  const query = document.getElementById("search").value.toLowerCase().trim();
  const statusFilter = document.getElementById("status-filter").value;

  const filtered = suppliers.filter(s => {
    if (statusFilter !== "All" && s.status !== statusFilter) return false;
    return [s.supplier_code, s.supplier_name, s.contact_person, s.contact_no, s.email]
      .some(v => (v || "").toLowerCase().includes(query));
  });

  document.getElementById("empty-state").style.display = filtered.length ? "none" : "block";

  document.getElementById("table-body").innerHTML = filtered.map(s => {
    const active = s.status === "Active";
    return `
    <tr>
      <td>${escapeHtml(s.supplier_code)}</td>
      <td>${escapeHtml(s.supplier_name)}</td>
      <td>${escapeHtml(s.contact_person || "—")}</td>
      <td>${escapeHtml(s.contact_no || "—")}</td>
      <td><span class="badge ${active ? "badge-success" : "badge-danger"}">${s.status}</span></td>
      <td>
        <button class="btn-secondary btn-small" onclick="viewSupplier(${s.supplier_id})">View</button>
        <button class="btn-secondary btn-small" onclick="editSupplier(${s.supplier_id})">Edit</button>
        <button class="${active ? "btn-danger" : "btn-secondary"} btn-small" onclick="toggleStatus(${s.supplier_id})">
          ${active ? "Deactivate" : "Activate"}
        </button>
      </td>
    </tr>`;
  }).join("");
}

function renderStats() {
  document.getElementById("stat-total").textContent = suppliers.length;
  document.getElementById("stat-active").textContent = suppliers.filter(s => s.status === "Active").length;
  document.getElementById("stat-inactive").textContent = suppliers.filter(s => s.status !== "Active").length;
}

/* 5) VIEW SUPPLIER */
function viewSupplier(id) {
  const s = suppliers.find(x => x.supplier_id == id);
  if (!s) return;
  const row = (label, value) =>
    `<div class="field"><label>${label}</label><div>${escapeHtml(value || "—")}</div></div>`;
  document.getElementById("view-title").textContent = s.supplier_name;
  document.getElementById("view-body").innerHTML =
    row("Supplier code", s.supplier_code) +
    row("Supplier name", s.supplier_name) +
    row("Contact person", s.contact_person) +
    row("Contact no.", s.contact_no) +
    row("Email", s.email) +
    row("Address", s.address) +
    row("Status", s.status);
  document.getElementById("view-backdrop").classList.add("open");
}

function closeView() {
  document.getElementById("view-backdrop").classList.remove("open");
}

/* 6) MODAL / FORM HANDLING */
function nextCode() {
  // Suggest the next SUP### code after the highest existing one
  const nums = suppliers
    .map(s => /^SUP(\d+)$/i.exec(s.supplier_code))
    .filter(Boolean)
    .map(m => parseInt(m[1], 10));
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return "SUP" + String(next).padStart(3, "0");
}

function openModal() {
  document.getElementById("modal-title").textContent = "Add supplier";
  document.getElementById("supplier-form").reset();
  document.getElementById("supplier-id").value = "";
  document.getElementById("supplier-code").value = nextCode();
  document.getElementById("modal-backdrop").classList.add("open");
}

function closeModal() {
  document.getElementById("modal-backdrop").classList.remove("open");
}

function editSupplier(id) {
  const s = suppliers.find(x => x.supplier_id == id);
  if (!s) return;
  document.getElementById("modal-title").textContent = "Edit supplier";
  document.getElementById("supplier-id").value = s.supplier_id;
  document.getElementById("supplier-code").value = s.supplier_code;
  document.getElementById("supplier-name").value = s.supplier_name;
  document.getElementById("contact-person").value = s.contact_person || "";
  document.getElementById("contact-no").value = s.contact_no || "";
  document.getElementById("email").value = s.email || "";
  document.getElementById("address").value = s.address || "";
  document.getElementById("modal-backdrop").classList.add("open");
}

async function saveSupplier(event) {
  event.preventDefault();
  const id = document.getElementById("supplier-id").value;
  const contactNo = document.getElementById("contact-no").value.trim();

  if (contactNo && !/^[0-9+\-\s()]{7,20}$/.test(contactNo)) {
    alert("Please enter a valid contact number (digits, +, -, spaces only).");
    return;
  }

  const record = {
    supplier_code:  document.getElementById("supplier-code").value.trim().toUpperCase(),
    supplier_name:  document.getElementById("supplier-name").value.trim(),
    contact_person: document.getElementById("contact-person").value.trim() || null,
    contact_no:     contactNo || null,
    email:          document.getElementById("email").value.trim() || null,
    address:        document.getElementById("address").value.trim() || null,
  };

  const { error } = id
    ? await supabaseClient.from("suppliers").update(record).eq("supplier_id", id)
    : await supabaseClient.from("suppliers").insert(record);

  if (error) {
    alert(error.code === "23505"
      ? "A supplier with that code already exists."
      : "Could not save: " + error.message);
    return;
  }
  closeModal();
  loadSuppliers();
}

/* 7) DEACTIVATE / ACTIVATE */
async function toggleStatus(id) {
  const s = suppliers.find(x => x.supplier_id == id);
  if (!s) return;
  const next = s.status === "Active" ? "Inactive" : "Active";
  if (next === "Inactive" &&
      !confirm("Deactivate " + s.supplier_name + "? The record is kept and can be reactivated later.")) return;

  const { error } = await supabaseClient.from("suppliers").update({ status: next }).eq("supplier_id", id);
  if (error) { alert("Could not update status: " + error.message); return; }
  loadSuppliers();
}

/* 8) INIT */
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { window.location.href = "login-page.html"; return; }
  loadSuppliers();
})();
</script>

</body>
</html>
