<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmacy Manager - Stock-In</title>

<!-- Supabase client library, loaded from a CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config/supabase.js"></script>
<script src="./js/auth.js"></script>
<link rel="stylesheet" href="css/styles.css">

<script defer src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js"></script>
  <script defer src="./js/motion.js"></script>
  <script defer src="./js/sidebar-router.js"></script>
</head>
<body>

<div class="app-layout">

<aside class="sidebar" id="sidebar"></aside>
<script src="./js/sidebar.js"></script>

  <div class="main-content">
    <header>
      <div class="inner">
        <div>
          <h1>Pharmacy Manager</h1>
          <div class="subtitle">Page : Inventory Receiving / Stock-In</div>
        </div>
      </div>
    </header>

        <main>
      <div class="stockin-layout">

        <!-- LEFT: form -->
        <div class="table-wrap" style="padding:1.5rem;">
          <h2 style="margin-top:0;">Stock-In Transaction</h2>
          <form id="stockin-form" onsubmit="receiveStock(event)">
            <div class="field">
              <label for="supplier">Supplier</label>
              <select id="supplier" required onchange="onSupplierChange()" style="width:100%; padding:0.6rem 0.9rem; border:1px solid var(--color-border); border-radius:var(--radius-sm);"></select>
            </div>
            <div class="field">
              <label for="medicine">Medicine</label>
              <select id="medicine" required onchange="onMedicineChange()" style="width:100%; padding:0.6rem 0.9rem; border:1px solid var(--color-border); border-radius:var(--radius-sm);"></select>
              <div id="med-hint" style="font-size:0.8rem; color:var(--color-text-soft); margin-top:0.3rem;"></div>
              <label style="display:flex; align-items:center; gap:0.4rem; margin-top:0.5rem; font-size:0.8rem; color:var(--color-text-soft); cursor:pointer;">
                <input type="checkbox" id="show-all" onchange="onSupplierChange()" style="width:auto;">
                Show all active medicines, not only those assigned to this supplier
              </label>
            </div>
            <div class="field">
              <label for="batch">Batch number</label>
              <input type="text" id="batch" required maxlength="50" placeholder="e.g. BATCH-00125">
            </div>
            <div class="field">
              <label for="quantity">Quantity</label>
              <input type="number" id="quantity" required min="1" step="1" placeholder="e.g. 500">
            </div>
            <div class="field">
              <label for="purchase-price">Purchase price (&#8369;)</label>
              <input type="number" id="purchase-price" required min="0" step="0.01" placeholder="e.g. 3.00">
            </div>
            <div class="field">
              <label for="selling-price">Selling price (&#8369;)</label>
              <input type="number" id="selling-price" required min="0" step="0.01" placeholder="e.g. 5.00">
            </div>
            <div class="field">
              <label for="expiry">Expiration date</label>
              <input type="date" id="expiry" required>
            </div>
            <div class="modal-actions" style="justify-content:flex-start;">
              <button type="submit" class="btn-primary" id="submit-btn">Receive stock</button>
              <button type="reset" class="btn-secondary" onclick="setTimeout(onSupplierChange,0)">Clear</button>
            </div>
          </form>
        </div>

        <!-- RIGHT: recent stock-ins -->
        <div>
          
          <div class="table-wrap" style="overflow-x:auto; padding:1.5rem;">
            <h2 style="margin-top:0;">Recent stock-ins</h2>
            <table>
              <thead><tr><th>Date</th><th>Medicine</th><th>Batch</th><th>Qty received</th><th>Notes</th></tr></thead>
              <tbody id="recent-body"></tbody>
            </table>
            <div class="empty-state" id="recent-empty" style="display:none;">No stock-in transactions yet.</div>
          </div>
        </div>

      </div>
    </main>
  </div>

</div>
<script>
/* 2) STATE */
// inventory_transactions.transaction_type only allows: PURCHASE, SALE, ADJUSTMENT, RETURN, EXPIRED.
// Receiving stock from a supplier is a PURCHASE.
const STOCK_IN_TYPE = "PURCHASE";

let suppliers = [];
let supplierLinks = [];   // medicine_suppliers rows for the chosen supplier

/* 3) DATA LOADING */
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : str;
  return div.innerHTML;
}
function medLabel(m) { return m.medicine_name + (m.strength ? " " + m.strength : ""); }

async function loadSuppliers() {
  const { data, error } = await supabaseClient
    .from("suppliers").select("supplier_id, supplier_code, supplier_name")
    .eq("status", "Active").order("supplier_name");
  if (error) { alert("Could not load suppliers: " + error.message); return; }
  suppliers = data;
  document.getElementById("supplier").innerHTML =
    suppliers.map(s => `<option value="${s.supplier_id}">${escapeHtml(s.supplier_code + " - " + s.supplier_name)}</option>`).join("");
  onSupplierChange();
}

// Step 1 -> 2: medicines linked to the chosen supplier (Lab 7) are offered.
// The checkbox lets staff pick any active medicine when a supplier has nothing assigned yet.
function setMedicineOptions(html, enabled) {
  const sel = document.getElementById("medicine");
  sel.innerHTML = html;
  sel.disabled = !enabled;      // a disabled select can't open an empty pop-up
}

async function onSupplierChange() {
  const supId = document.getElementById("supplier").value;
  const hint = document.getElementById("med-hint");
  const showAll = document.getElementById("show-all").checked;
  supplierLinks = [];
  hint.textContent = "";

  if (!supId) { setMedicineOptions('<option value="">Select a supplier first</option>', false); return; }
  setMedicineOptions('<option value="">Loading medicines...</option>', false);

  // 1) medicines assigned to this supplier
  const { data, error } = await supabaseClient
    .from("medicine_suppliers")
    .select("medicine_id, purchase_price, medicines(medicine_code, medicine_name, strength, unit_price, status)")
    .eq("supplier_id", supId);
  if (document.getElementById("supplier").value !== supId) return;   // user picked another supplier meanwhile
  if (error) {
    setMedicineOptions('<option value="">Could not load medicines</option>', false);
    hint.textContent = "Could not load medicines: " + error.message;
    return;
  }
  const linked = (data || []).filter(l => l.medicines && l.medicines.status === "Active");

  // 2) optionally every active medicine (assigned ones keep their agreed purchase price)
  if (showAll) {
    const { data: all, error: allErr } = await supabaseClient
      .from("medicines")
      .select("medicine_id, medicine_code, medicine_name, strength, unit_price, status")
      .eq("status", "Active").order("medicine_name");
    if (document.getElementById("supplier").value !== supId) return;
    if (allErr) {
      setMedicineOptions('<option value="">Could not load medicines</option>', false);
      hint.textContent = "Could not load medicines: " + allErr.message;
      return;
    }
    supplierLinks = (all || []).map(m => {
      const l = linked.find(x => x.medicine_id === m.medicine_id);
      return { medicine_id: m.medicine_id, purchase_price: l ? l.purchase_price : null, assigned: !!l, medicines: m };
    });
  } else {
    supplierLinks = linked.map(l => ({ ...l, assigned: true }));
  }

  if (!supplierLinks.length) {
    setMedicineOptions('<option value="">No medicines available</option>', false);
    hint.innerHTML = showAll
      ? "There are no active medicines yet. Add some on the Medicines page first."
      : 'No medicines are assigned to this supplier yet. Assign some on the <a href="medicine-suppliers.html">Medicine Supply</a> page, or tick the box below to pick any medicine.';
    onMedicineChange();
    return;
  }

  setMedicineOptions(
    supplierLinks.map(l => `<option value="${l.medicine_id}">${escapeHtml(l.medicines.medicine_code + " - " + medLabel(l.medicines) + (showAll && !l.assigned ? " (not assigned to this supplier)" : ""))}</option>`).join(""),
    true);
  onMedicineChange();
}

// Pre-fill prices from the supplier link / medicine record (still editable)
function onMedicineChange() {
  const medId = document.getElementById("medicine").value;
  const link = supplierLinks.find(l => String(l.medicine_id) === String(medId));
  if (!link) return;
  document.getElementById("purchase-price").value =
    link.purchase_price == null ? "" : Number(link.purchase_price).toFixed(2);
  document.getElementById("selling-price").value = Number(link.medicines.unit_price || 0).toFixed(2);
}

async function loadRecent() {
  const { data, error } = await supabaseClient
    .from("inventory_transactions")
    .select("*, medicines(medicine_name, strength), inventory(batch_number)")
    .in("reference_type", ["purchase", "stock_in"])
    .order("transaction_id", { ascending: false })
    .limit(15);
  if (error) { console.error("Recent stock-ins:", error.message); return; }
  document.getElementById("recent-empty").style.display = data.length ? "none" : "block";
  document.getElementById("recent-body").innerHTML = data.map(r => `
    <tr>
      <td>${r.created_at ? new Date(r.created_at).toLocaleString() : "—"}</td>
      <td>${escapeHtml(r.medicines ? medLabel(r.medicines) : "—")}</td>
      <td>${escapeHtml(r.inventory?.batch_number || "—")}</td>
      <td>+${r.quantity_change}</td>
      <td>${escapeHtml(r.notes || "")}</td>
    </tr>`).join("");
}

/* 4) RECEIVE STOCK */
async function receiveStock(event) {
  event.preventDefault();
  const supId = document.getElementById("supplier").value;
  const medId = document.getElementById("medicine").value;
  const batch = document.getElementById("batch").value.trim();
  const qty = parseInt(document.getElementById("quantity").value, 10);
  const buy = parseFloat(document.getElementById("purchase-price").value);
  const sell = parseFloat(document.getElementById("selling-price").value);
  const expiry = document.getElementById("expiry").value;

  if (!supId || !medId) { alert("Select a supplier and a medicine."); return; }
  if (!batch) { alert("Enter a batch number."); return; }
  if (!Number.isInteger(qty) || qty <= 0) { alert("Quantity must be a whole number greater than zero."); return; }
  if (isNaN(buy) || buy < 0 || isNaN(sell) || sell < 0) { alert("Enter valid prices."); return; }
  if (new Date(expiry) <= new Date()) { alert("Expiration date must be in the future."); return; }

  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  let stage = "start";
  let purchaseId = null;
  try {
    const me = await getProfile();
    const supplier = suppliers.find(s => s.supplier_id == supId);

    // 1) Purchase record (who we bought from, when, how much)
    stage = "purchase";
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    const purchaseNo = "PO-" + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) +
                       "-" + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
    const { data: purchase, error: pErr } = await supabaseClient.from("purchases")
      .insert({ purchase_no: purchaseNo, supplier_id: supId, user_id: me.id,
                total_amount: qty * buy, status: "Received",
                notes: "Received via Stock-In page" })
      .select("purchase_id").single();
    if (pErr) throw pErr;
    purchaseId = purchase.purchase_id;

    stage = "purchase_item";
    const { error: piErr } = await supabaseClient.from("purchase_items")
      .insert({ purchase_id: purchaseId, medicine_id: medId, batch_number: batch,
                quantity: qty, unit_cost: buy, expiration_date: expiry });
    if (piErr) throw piErr;

    // 2) Inventory: same medicine + batch already on the shelf? Add to it instead of duplicating.
    stage = "inventory";
    const { data: existing, error: findErr } = await supabaseClient
      .from("inventory").select("inventory_id, quantity")
      .eq("medicine_id", medId).eq("batch_number", batch).maybeSingle();
    if (findErr) throw findErr;

    let inventoryId;
    if (existing) {
      const { error } = await supabaseClient.from("inventory")
        .update({ quantity: existing.quantity + qty, purchase_price: buy, selling_price: sell, expiration_date: expiry })
        .eq("inventory_id", existing.inventory_id);
      if (error) throw error;
      inventoryId = existing.inventory_id;
    } else {
      const { data: created, error } = await supabaseClient.from("inventory")
        .insert({ medicine_id: medId, batch_number: batch, quantity: qty,
                  purchase_price: buy, selling_price: sell, expiration_date: expiry })
        .select("inventory_id").single();
      if (error) throw error;
      inventoryId = created.inventory_id;
    }

    // 3) Audit trail
    stage = "audit";
    const { error: txErr } = await supabaseClient.from("inventory_transactions").insert({
      inventory_id: inventoryId,
      medicine_id: medId,
      transaction_type: STOCK_IN_TYPE,
      quantity_change: qty,
      reference_type: "purchase",
      reference_id: purchaseId,
      user_id: me.id,
      notes: "Received from " + supplier.supplier_name + " (" + supplier.supplier_code + ") @ " + buy.toFixed(2) + " - " + purchaseNo,
    });
    if (txErr) throw txErr;

    alert("Stock received: " + qty + " units added (" + purchaseNo + ").");
    document.getElementById("stockin-form").reset();
    onSupplierChange();
    loadRecent();
  } catch (err) {
    // Nothing reached the shelf yet -> cancel the purchase record so it is not left half-finished
    if (purchaseId && (stage === "purchase_item" || stage === "inventory")) {
      await supabaseClient.from("purchases")
        .update({ status: "Cancelled", notes: "Failed at step '" + stage + "': " + err.message })
        .eq("purchase_id", purchaseId);
    }
    alert(stage === "audit"
      ? "Stock was added, but the audit log row failed: " + err.message
      : "Could not receive stock (step: " + stage + "): " + err.message);
  } finally {
    btn.disabled = false;
  }
}

/* 5) INIT */
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { window.location.href = "login-page.html"; return; }
  loadSuppliers();
  loadRecent();
})();
</script>

</body>
</html>
