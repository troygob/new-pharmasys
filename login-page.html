<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmacy Manager - Login</title>

<!-- Supabase client library, loaded from a CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase.js"></script>
<script src="./js/auth.js"></script>
<link rel="stylesheet" href="styles.css">

</head>
<body>

<main>
  <div class="login-container">
    <div class="login-card">
      <h1>Sign In</h1>
      <p class="login-subtitle">Enter your credentials to access the dashboard</p>
      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="********">
        </div>
        <div id="login-error" class="login-error"></div>
        <button type="submit" class="btn-primary login-submit" id="login-btn">Sign In</button>
      </form>

      <div style="margin-top:1rem; text-align:center;">
        <div style="font-size:0.85rem; margin-bottom:0.5rem;">Quick login (demo)</div>
        <button type="button" class="btn-secondary" onclick="quickLogin('admin@gmail.com', 'admin')">Admin</button>
        <button type="button" class="btn-secondary" onclick="quickLogin('cashier@gmail.com', 'cashier123')">Cashier</button>
      </div>
    </div>
  </div>
</main>

<script>
  const MAX_ATTEMPTS = 5;      // wrong passwords allowed in a row
  const LOCK_SECONDS = 30;     // how long the form locks afterwards
  let failedAttempts = 0;

  function lockForm() {
    const btn = document.getElementById("login-btn");
    const errorBox = document.getElementById("login-error");
    let left = LOCK_SECONDS;
    btn.disabled = true;
    const timer = setInterval(() => {
      errorBox.textContent = "Too many failed attempts. Try again in " + left + "s.";
      if (left-- <= 0) {
        clearInterval(timer);
        btn.disabled = false;
        failedAttempts = 0;
        errorBox.textContent = "";
      }
    }, 1000);
  }

  async function login(email, password) {
    const errorBox = document.getElementById("login-error");
    errorBox.textContent = "";

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      failedAttempts++;
      errorBox.textContent = error.message;
      if (failedAttempts >= MAX_ATTEMPTS) lockForm();
      return;
    }

    // Signed in. Check the account is usable, then open the page for their role.
    const me = await getProfile(true);
    if (!me || me.status !== "Active") {
      await supabaseClient.auth.signOut();
      errorBox.textContent = "This account is inactive. Contact an administrator.";
      return;
    }
    if (!me.role) {
      window.location.href = "denied.html?reason=norole";
      return;
    }
    window.location.href = LANDING_PAGE[me.role] || "index.html";
  }

  document.getElementById("login-form").addEventListener("submit", (event) => {
    event.preventDefault();
    login(document.getElementById("email").value, document.getElementById("password").value);
  });

  function quickLogin(email, password) {
    document.getElementById("email").value = email;
    document.getElementById("password").value = password;
    login(email, password);
  }
</script>
</body>
</html>
