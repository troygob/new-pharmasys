<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PharmaSys — Pharmacy Management System</title>
    <meta
      name="description"
      content="Minimalist pharmacy management system for inventory tracking, FEFO point-of-sale, prescriptions, and role-based operations."
    />
    <meta property="og:title" content="PharmaSys — Pharmacy Management System" />
    <meta
      property="og:description"
      content="Minimalist pharmacy management system for inventory tracking, FEFO point-of-sale, prescriptions, and role-based operations."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..600;1,9..40,400..600&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("pharmasys-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (saved === "dark" || ((saved === "system" || !saved) && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F6F8F9] text-slate-900 dark:bg-[#0B1117] dark:text-slate-100 antialiased selection:bg-teal-500/20 selection:text-teal-900 dark:selection:text-teal-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
